name: Verified address APK
on:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/address-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Compile APK
        id: compile
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
      - uses: actions/upload-artifact@v4
        id: apk
        with:
          name: zhkh-address-search-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Publish build result
        if: always()
        uses: actions/github-script@v7
        env:
          BUILD_STATUS: ${{ job.status }}
          ARTIFACT_URL: ${{ steps.apk.outputs.artifact-url }}
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('build.log') ? fs.readFileSync('build.log', 'utf-8').slice(-14000) : 'Compilation did not start.';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              ...context.repo,
              title: `APK build ${context.runNumber}: ${process.env.BUILD_STATUS}`,
              body: `Commit: ${context.sha}\nRun: ${run}\nAPK: ${process.env.ARTIFACT_URL || 'not produced'}\n\nBuild log tail:\n\n~~~text\n${log}\n~~~`
            });
